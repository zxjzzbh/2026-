name: C++ and 5G offline checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact published release
        run: python3 tools/verify_release.py
      - name: Install matching C++ and Python OpenCV libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopencv-dev python3-dev python3-opencv python3-numpy
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=/usr/bin/python3
      - name: Build
        run: cmake --build build --parallel 2
      - name: Offline tests (no vehicle connection)
        run: ctest --test-dir build --output-on-failure
