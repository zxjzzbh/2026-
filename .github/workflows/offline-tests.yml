name: C++ and 5G offline checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact published release
        run: python tools/verify_release.py
      - name: Install OpenCV development libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopencv-dev
      - name: Configure
        run: cmake -S cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Offline tests (no vehicle connection)
        run: ctest --test-dir build --output-on-failure
