name: Offline software checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e "vision[test]"
      - run: python -m pytest vision/tests -q -ra
      - run: python -m carvision autonomy-check --profile vision/configs/autonomy-pi5.json
      - run: python -m carvision autonomy-demo --profile vision/configs/autonomy-pi5.json --race-config vision/configs/race-2026.json --output run/ci-offline-demo
      - run: python tools/audit_snapshot_20261008.py
      - run: python tools/verify_publication.py
